<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches Psychcast's deepest burgundy surface. -->
    <meta name="theme-color" content="#120b0f" />
    <!-- The one face the system uses. Self-hosted, so this is a same-origin
         hint and no third party learns who opened the app. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Same-origin Psychcast brand asset. -->
    <link rel="icon" type="image/svg+xml" href="/psychcast-icon.svg" />
    <title>Psychcast</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
